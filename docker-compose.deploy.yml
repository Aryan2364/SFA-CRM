# Runs the PRE-BUILT image from GHCR. This is the file you use ON THE SERVER.
# It does NOT build anything — it pulls the image GitHub Actions already built.
#
# Usage on the server:
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
# or just: ./deploy.sh
#
# Requires a .env.production file next to this one (see .env.production.example).
services:
  sfacrm:
    image: ghcr.io/aryan2364/sfacrm:latest
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      # NO TZ HERE, DELIBERATELY. The app runs UTC, and so does RDS.
      # node:20-alpine ships no tzdata, so a TZ value is silently IGNORED and
      # the container runs UTC anyway -- which is what we want and what all the
      # date logic was verified against. Adding tzdata to "fix" this would jump
      # the container to IST while RDS stays UTC, shifting every timestamp by
      # 5:30 and blanking the manager review grid entirely, with no error.
      # See PLAN.md 5.8.
    ports:
      # Bound to LOOPBACK ONLY. A bare "3500:3000" publishes on 0.0.0.0, and
      # Docker writes its own nat/DOCKER-USER rules ahead of UFW — so the port
      # would be reachable from the internet even with the host firewall shut.
      # Only the reverse proxy should reach this; it terminates TLS.
      # NOTE: if nginx/Caddy runs in a CONTAINER rather than on the host, it
      # cannot reach 127.0.0.1 here — put it on the sfacrm_prod network and
      # talk to http://sfacrm:3000 directly instead of publishing a port.
      # 3400 is taken by budget-tracking-frontend (sbn-frontend).
      - "127.0.0.1:3500:3000"
    restart: unless-stopped
    networks:
      - sfacrm_prod

networks:
  sfacrm_prod:
    driver: bridge
